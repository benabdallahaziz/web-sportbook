spring.application.name=api-gateway
server.port=8085

# ---- Eureka ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ---- Routes dynamiques (lb:// = résolution via Eureka + load balancing) ----
# Le nom après lb:// doit être égal à spring.application.name du microservice.

# 1. Identity & User
spring.cloud.gateway.routes[0].id=IDENTITY-USER
spring.cloud.gateway.routes[0].uri=lb://identity-user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/auth/**,/api/roles/**

# 2. Venue Management
spring.cloud.gateway.routes[1].id=VENUE-MANAGEMENT
spring.cloud.gateway.routes[1].uri=lb://venue-management-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/venues/**,/api/fields/**

# 3. Booking & Availability
spring.cloud.gateway.routes[2].id=BOOKING-AVAILABILITY
spring.cloud.gateway.routes[2].uri=lb://booking-availability-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**,/api/timeslots/**

# 4. Marketplace
spring.cloud.gateway.routes[3].id=MARKETPLACE
spring.cloud.gateway.routes[3].uri=lb://marketplace-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/products/**,/api/cart/**,/api/orders/**

# 5. Tournament & Events
spring.cloud.gateway.routes[4].id=TOURNAMENT-EVENTS
spring.cloud.gateway.routes[4].uri=lb://tournament-events-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/tournaments/**,/api/teams/**,/api/matches/**

# 6. Coach & Training
spring.cloud.gateway.routes[5].id=COACH-TRAINING
spring.cloud.gateway.routes[5].uri=lb://coach-training-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/coaches/**,/api/sessions/**,/api/programs/**

# ---- Logs de routage ----
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# ---- CORS (apps web / mobile) ----
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
