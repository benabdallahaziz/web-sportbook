# Sert l'application Angular et relaie /api vers l'API Gateway (même origine : pas de CORS,
# et l'application fonctionne quelle que soit son adresse publique, ex. KillerCoda).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api-gateway:8085;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
  }

  # Routes Angular (/tournaments, /venues/gerant…) : toujours index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
